name: Trigger site deploy

# Repo-agnostic: copy as-is into any repo the site's sitemap links to, and add the SITE_DEPLOY_TOKEN secret there.

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # A fine-grained PAT with contents:write on the site repo; the default GITHUB_TOKEN can't reach other repos.
      - name: Dispatch to rjayasin.github.io
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          gh api repos/rjayasin/rjayasin.github.io/dispatches \
            -f event_type=sitemap-update \
            -f "client_payload[repo]=$GITHUB_REPOSITORY"
