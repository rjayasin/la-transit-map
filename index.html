<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LA Transit — 24h</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3ec;
               font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  /* 100dvh (not vh): on mobile, 100vh includes the area behind the browser
     toolbar, stretching the canvas bitmap vertically. resize() also sets
     explicit px sizes to keep CSS box and drawing buffer in exact agreement. */
  #c { display: block; width: 100vw; height: 100dvh; cursor: grab; touch-action: none; }
  #c.drag { cursor: grabbing; }
  #bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px;
         box-sizing: border-box; max-width: calc(100vw - 20px);
         background: rgba(20,20,25,.82); color: #fff; border-radius: 12px;
         padding: 10px 16px; display: flex; align-items: center; gap: 12px;
         backdrop-filter: blur(6px); box-shadow: 0 4px 18px rgba(0,0,0,.3);
         transition: opacity .45s; }
  #bar button, #bar select { flex: none; }
  #bar.faded { opacity: 0; pointer-events: none; }
  #bar button { background: transparent; color: #fff; border: 0; border-radius: 8px;
                width: 38px; height: 30px; font-size: 15px; cursor: pointer; }
  #bar button:hover { background: rgba(255,255,255,.16); }
  /* Wider than the icon buttons because it carries a word, and tinted so it
     reads as new rather than as one more control that was always there. */
  #bar #upd { width: auto; padding: 0 10px; font-size: 13px; background: #e8a33d;
              color: #201800; font-weight: 600; }
  #bar #upd:hover { background: #f0b459; }
  #bar #upd[hidden] { display: none; }
  #bar input[type=range] { flex: 1 1 auto; min-width: 60px; width: min(46vw, 520px); }
  #bar select { background: #333; color: #fff; border: 0; border-radius: 6px; padding: 4px; }
  #stats { font-variant-numeric: tabular-nums; opacity: .85; font-size: 13px; min-width: 0;
           flex: 0 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #filters { position: fixed; bottom: 72px;
             background: rgba(20,20,25,.92); color: #fff; border-radius: 12px;
             padding: 12px 16px; display: none; backdrop-filter: blur(6px);
             box-shadow: 0 4px 18px rgba(0,0,0,.3); font-size: 13px; }
  #filters.open { display: block; }
  /* caret pointing down at the filter button */
  #filters::after { content: ""; position: absolute; bottom: -8px;
                    left: var(--caret-x, 50%); margin-left: -8px;
                    border: 8px solid transparent; border-bottom: 0;
                    border-top-color: rgba(20,20,25,.92); }
  #filters .grid { display: grid; grid-template-columns: repeat(2, max-content);
                   gap: 5px 20px; margin-top: 9px; }
  #filters label { display: flex; align-items: center; gap: 7px; cursor: pointer;
                   white-space: nowrap; }
  #filters .head { border-bottom: 1px solid rgba(255,255,255,.25); padding-bottom: 8px;
                   font-weight: 600; }
  #filters input { accent-color: #e8a33d; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="filters"></div>
<div id="bar">
  <button id="play" title="play/pause">⏸</button>
  <input id="scrub" type="range" min="0" max="86399" step="10" value="0">
  <select id="speed">
    <option value="30">30×</option>
    <option value="60" selected>60×</option>
    <option value="150">150×</option>
    <option value="400">400×</option>
  </select>
  <span id="stats"></span>
  <button id="upd" title="a newer build is live — click to reload" hidden>↻ update</button>
  <button id="sys" title="transit systems">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px">
      <path d="M3 4h18l-7.2 8.4V19l-3.6 2.4v-9L3 4z"/>
    </svg>
  </button>
</div>
<script>
// Bootstrapper. This file is the one URL that cannot be versioned, being the
// address people visit, so it is made not to matter: nothing here changes
// between deploys, and a stale copy is byte-identical to a fresh one.
//
// The client moves to app.js, asked for by the build that is live right now.
// version.json is fetched past both caches, so the URL it produces is
// content-addressed and can be cached hard. Versioning app.js alone would be
// worse than nothing: a stale index.html would ask for the stale hash forever.
// It only works because what asks the question is constant.
(async () => {
  let v = "";
  try {
    const res = await fetch(`version.json?ts=${Date.now()}`, { cache: "no-store" });
    if (res.ok) v = (await res.json()).sha || "";
  } catch (e) { /* offline, or mid-deploy: fall through to the unversioned URL */ }
  const s = document.createElement("script");
  s.src = v ? `app.js?v=${encodeURIComponent(v.slice(0, 7))}` : "app.js";
  s.onerror = () => {
    document.getElementById("bar").hidden = true;
    document.body.insertAdjacentHTML("beforeend",
      '<p style="position:fixed;inset:0;display:grid;place-content:center;margin:0;'
      + 'font:15px -apple-system,Arial;color:#333">Could not load the map. Reload to retry.</p>');
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
